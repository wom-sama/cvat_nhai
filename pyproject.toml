[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvat-nhai"
version = "1.6.0"
description = "Fast desktop relabeling tool for YOLO and classification-folder image datasets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=11.0,<12",
  "PySide6>=6.8,<7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
cvat-nhai = "cvat_nhai.app:main"
cvat-nhai-cli = "cvat_nhai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
qt_api = "pyside6"
